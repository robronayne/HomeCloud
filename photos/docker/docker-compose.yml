# =============================================================================
# Immich Docker Compose - Local Server with Cold Storage Backup
# =============================================================================
# Primary storage: Local SSD
# Backup: Quarterly sync to Glacier Deep Archive (2 regions)
# =============================================================================

name: immich

services:
  # ---------------------------------------------------------------------------
  # Immich Server
  # ---------------------------------------------------------------------------
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ./upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: always

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  database:
    container_name: immich_postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    restart: always

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    volumes:
      - ./redis:/data
    restart: always

  # ---------------------------------------------------------------------------
  # S3 Sync - Monthly backup to Glacier Deep Archive (2 regions)
  # ---------------------------------------------------------------------------
  # Backs up photos + PostgreSQL database to cold storage
  s3-sync:
    container_name: immich_s3_sync
    image: amazon/aws-cli:latest
    volumes:
      - ./upload:/upload:ro
      - ./db-backup:/db-backup
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION_1=${AWS_REGION_1}
      - S3_BUCKET_1=${S3_BUCKET_1}
      - AWS_REGION_2=${AWS_REGION_2}
      - S3_BUCKET_2=${S3_BUCKET_2}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[Monthly Backup] Starting cold storage sync..."
          
          echo "Syncing photos to cold storage bucket 1 (us-west-1)..."
          aws s3 sync /upload s3://$${S3_BUCKET_1}/upload --storage-class DEEP_ARCHIVE --region $${AWS_REGION_1}
          
          echo "Syncing photos to cold storage bucket 2 (us-west-2)..."
          aws s3 sync /upload s3://$${S3_BUCKET_2}/upload --storage-class DEEP_ARCHIVE --region $${AWS_REGION_2}
          
          echo "Backing up database..."
          if [ -f /db-backup/immich-db.sql ]; then
            aws s3 cp /db-backup/immich-db.sql s3://$${S3_BUCKET_1}/db-backup/immich-db-$$(date +%Y%m%d).sql --storage-class DEEP_ARCHIVE --region $${AWS_REGION_1}
            aws s3 cp /db-backup/immich-db.sql s3://$${S3_BUCKET_2}/db-backup/immich-db-$$(date +%Y%m%d).sql --storage-class DEEP_ARCHIVE --region $${AWS_REGION_2}
          fi
          
          echo "[Monthly Backup] Complete. Next backup in 30 days."
          sleep 2592000
        done
    restart: always
    depends_on:
      - immich-server
      - database

  # ---------------------------------------------------------------------------
  # Database Backup - Creates PostgreSQL dump for s3-sync to upload
  # ---------------------------------------------------------------------------
  db-backup:
    container_name: immich_db_backup
    image: postgres:14-alpine
    volumes:
      - ./db-backup:/db-backup
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[DB Backup] Creating PostgreSQL dump..."
          pg_dump -h database -U $${DB_USERNAME:-postgres} immich > /db-backup/immich-db.sql
          echo "[DB Backup] Complete. Next dump in 30 days."
          sleep 2592000
        done
    restart: always
    depends_on:
      - database

networks:
  default:
    name: immich_network
